[project]
name = "maoniang"
version = "0.1.0"
description = "A QQ group bot on a layered app/ spine (NoneBot2 + OneBot v11 + Responses API)."
requires-python = ">=3.11"
dependencies = [
    "nonebot2[fastapi]>=2.4.0,<3.0.0",
    "nonebot-adapter-onebot>=2.4.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "plugins"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
